name: Deploy to PROD

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Fabric items to PROD workspace
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    # "environment: prod" pauses this job until a reviewer configured on
    # the "prod" Environment approves it (Settings > Environments > prod
    # > Required reviewers).
    environment:
      name: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to PROD workspace
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          python scripts/deploy.py \
            --workspace-id "${{ secrets.FABRIC_WORKSPACE_ID }}" \
            --environment PROD \
            --repo-dir "workspace" \
            --unpublish-orphans
