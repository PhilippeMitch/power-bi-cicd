name: CI - PROD (release -> main)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  checks:
    name: Validate PR into main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce branch naming convention
        run: |
          if [[ "${{ github.head_ref }}" != release/* ]]; then
            echo "::error::PRs into 'main' must come from a 'release/*' branch (got '${{ github.head_ref }}')."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate parameter.yml
        run: python -c "import yaml; yaml.safe_load(open('workspace/parameter.yml'))"

      - name: Python syntax check
        run: python -m py_compile scripts/*.py

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Secret Scanning Review Action
        uses: advanced-security/secret-scanning-review-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.SCAN_GITHUB_TOKEN }}
